[project]
name = "tradeall-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "django>=5.2,<5.3",
  "djangorestframework>=3.16",
  "djangorestframework-simplejwt>=5.5",
  "django-environ>=0.12",
  "django-cors-headers>=4.7",
  "django-filter>=25.1",
  "drf-spectacular>=0.28",
  "psycopg[binary]>=3.2",
  "channels>=4.2",
  "channels-redis>=4.2",
  "daphne>=4.1",
  "redis>=5.2",
  "celery>=5.5",
  "anthropic>=0.70",
  "pydantic>=2.11",
  "httpx>=0.28",
  "yfinance>=0.2.60",
  "feedparser>=6.0",
  "websockets>=13",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-django>=4.11", "ruff>=0.12"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E501", "B904"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E", "W", "I", "UP"]
